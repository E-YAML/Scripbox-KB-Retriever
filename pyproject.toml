[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scripbox_kb*"]

[project]
name = "scripbox-kb-retriever"
version = "2.0.0"
description = "Production RAG-powered Scripbox Knowledge Base assistant with LangGraph cyclic pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.9.0",
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "typing-extensions>=4.11.0",
    "streamlit>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "pyyaml>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line length (managed by ruff format)
    "E402",    # module level import not at top of file
    "RUF001",  # ambiguous unicode in string (UI icons/dashes)
    "RUF002",  # ambiguous unicode in docstring
    "RUF003",  # ambiguous unicode in comment
    "SIM105",  # try-except-pass vs contextlib.suppress
    "B905",    # zip without strict=
    "B007",    # unused loop control variable in enumerate
]

[tool.ruff.lint.isort]
known-first-party = ["scripbox_kb"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
addopts = "--strict-markers -v"
